serenity {
  project.name = "Automatizacion - Tricentis"
  take.screenshots = FOR_FAILURES

  webdriver {
    driver = chrome
    autodownload = true
  }

  chrome.switches = "--incognito"
}

# En CI (GitHub Actions) sobreescribir con: -Dheadless.mode=true
headless.mode = false

environments {
  default {
    webdriver.base.url = "https://demowebshop.tricentis.com"
  }
}
